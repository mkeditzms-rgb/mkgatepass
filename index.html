<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LPSL Gate Pass Manager</title>
<style>
:root{--primary:#123b68;--primary2:#0b2746;--accent:#1683ff;--bg:#f3f6fa;--card:#fff;--text:#18212b;--muted:#687789;--border:#d9e1ea;--danger:#d92d20;--success:#16803c;--warning:#b54708}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.hidden{display:none!important}.app{min-height:100vh}.topbar{height:66px;background:linear-gradient(135deg,var(--primary2),var(--primary));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 2px 12px #0002;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.3px}.brand-mark{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--primary);display:grid;place-items:center;font-weight:900}.top-actions{display:flex;gap:8px;align-items:center}.user-pill{font-size:13px;opacity:.9;margin-right:8px}
.btn{padding:10px 14px;border-radius:8px;font-weight:700;background:#fff;color:var(--primary);box-shadow:0 1px 2px #0001}.btn.primary{background:var(--accent);color:#fff}.btn.dark{background:var(--primary2);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.success{background:var(--success);color:#fff}.btn.light{background:#edf3f9;color:var(--primary)}.btn.small{padding:7px 10px;font-size:12px}
.layout{display:flex;min-height:calc(100vh - 66px)}.sidebar{width:235px;background:#fff;border-right:1px solid var(--border);padding:18px 12px;position:fixed;top:66px;bottom:0;overflow:auto}.navbtn{width:100%;text-align:left;padding:12px 13px;border-radius:8px;background:transparent;margin:3px 0;color:#415164;font-weight:700}.navbtn.active,.navbtn:hover{background:#eaf3ff;color:var(--primary)}.main{margin-left:235px;width:calc(100% - 235px);padding:24px;max-width:1700px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.page-head h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 2px 6px #00000008}.stat .label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}.stat .value{font-size:28px;font-weight:850;margin-top:7px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 2px 7px #00000008;margin-bottom:16px}.card h2{font-size:16px;margin:0 0 14px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:middle}th{background:#f7f9fc;color:#526173;font-size:11px;text-transform:uppercase;letter-spacing:.4px}tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.badge.green{background:#e7f7ed;color:#137333}.badge.red{background:#fdeceb;color:#b42318}.badge.blue{background:#e8f1ff;color:#175cd3}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.green{background:#16a34a}.dot.red{background:#e03131}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.field label{display:block;font-size:12px;font-weight:800;color:#536274;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 11px;background:#fff;outline:none}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#72a9e7;box-shadow:0 0 0 3px #1683ff16}.span2{grid-column:span 2}.span4{grid-column:span 4}
.item-row{display:grid;grid-template-columns:1.5fr 1fr 90px 130px 120px 42px;gap:8px;align-items:end;margin-bottom:8px}.item-row input,.item-row select{border:1px solid var(--border);border-radius:8px;padding:9px}.return-cell{display:flex;align-items:center;gap:7px;height:38px;font-size:12px;font-weight:800}.return-toggle{width:18px;height:18px;accent-color:#16a34a}
.searchbar{display:flex;gap:9px;margin-bottom:12px}.searchbar input{flex:1;padding:11px;border:1px solid var(--border);border-radius:8px}.empty{padding:35px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#07152699;display:grid;place-items:center;padding:20px;z-index:100}.modal-box{background:#fff;border-radius:14px;width:min(980px,100%);max-height:92vh;overflow:auto;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0}.close{background:#eef2f6;border-radius:50%;width:34px;height:34px;font-weight:900}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#2b6ea5 0,#123b68 35%,#071a2d 100%);padding:20px}.login-box{width:min(430px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 25px 70px #0006}.login-logo{width:62px;height:62px;border-radius:16px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;margin-bottom:16px}.login h1{margin:0 0 6px}.login p{color:var(--muted);font-size:13px}.login .field{margin:14px 0}.login .btn{width:100%;margin-top:8px}.login-note{font-size:11px;color:#8a94a1;margin-top:15px;line-height:1.5}
.toast{position:fixed;right:20px;bottom:20px;background:#172b3e;color:#fff;padding:12px 16px;border-radius:9px;z-index:300;box-shadow:0 5px 25px #0003;font-size:13px}.toast.success{background:#137333}.toast.error{background:#b42318}
.kpi-green{color:#137333}.kpi-red{color:#b42318}.section-title{font-size:14px;font-weight:850;margin:20px 0 10px}
.footer-note{font-size:11px;color:#8390a0;margin-top:14px}
.settings-box{max-width:800px}
.danger-zone{border:1px solid #f2c7c3;background:#fff7f6;border-radius:10px;padding:15px}
.checkbox{display:flex;gap:8px;align-items:center;font-size:13px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}.span4{grid-column:span 2}.item-row{grid-template-columns:1fr 1fr 80px 110px 100px 40px}}
@media(max-width:700px){.sidebar{display:none}.main{margin-left:0;width:100%;padding:14px}.topbar{padding:0 12px}.user-pill{display:none}.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.span2,.span4{grid-column:span 1}.page-head{align-items:flex-start;flex-direction:column}.item-row{grid-template-columns:1fr 1fr}.item-row>*:nth-child(n+3){grid-column:auto}.item-row .remove-item{grid-column:auto}}
@media print{
@page{size:A4 portrait;margin:10mm}
body{background:#fff!important}.no-print,.topbar,.sidebar{display:none!important}.main{margin:0!important;width:100%!important;padding:0!important}.print-sheet{display:block!important}.gatepass-paper{box-shadow:none!important;border:0!important;width:100%!important;min-height:277mm!important}
}
.print-sheet{display:none}
.gatepass-paper{background:#fff;width:190mm;min-height:277mm;margin:0 auto;padding:0;color:#111;font-family:Arial,Helvetica,sans-serif;box-shadow:0 3px 20px #0002}
.gp-document{width:100%;padding:0}
.gp-top{display:grid;grid-template-columns:45mm 1fr 32mm;align-items:center;gap:5mm;height:24mm;margin-bottom:4mm}
.gp-logo{width:40mm;height:auto;display:block}
.gp-company{text-align:center}.gp-company-name{font-size:18px;font-weight:800;line-height:1.1}.gp-company-info{font-size:8.5px;line-height:1.25;margin-top:1.5mm}
.gp-title-box{background:#a90010;color:#fff;border:1px solid #111;height:13mm;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.gp-info{width:100%;border:1px solid #333;border-collapse:collapse;table-layout:fixed}.gp-info td{border:1px solid #bbb;padding:3mm 1.5mm 2.3mm;vertical-align:top;height:14.5mm;font-size:9px}.gp-info .address-cell{height:13mm}
.gp-label{font-size:9px;font-weight:800;display:block;margin-bottom:4mm}.gp-line{display:inline-block;border-bottom:1px dotted #777;min-width:28mm;height:3mm}.gp-line.long{min-width:60mm}.gp-line.address{width:100%;min-width:0}
.gp-type{font-size:9px;display:flex;gap:6mm;align-items:center}.gp-type span::before{content:"■";font-size:9px;margin-right:1.5mm}
.gp-section-title{font-size:10px;color:#b00012;font-weight:800;text-align:left;margin:5mm 0 1.2mm;padding-left:12mm}
.gp-table{width:100%;border-collapse:collapse;table-layout:fixed}.gp-table th{background:#151515;color:#fff;border:1px solid #222;padding:2.2mm 1.5mm;font-size:8.5px;text-align:center}.gp-table td{border:1px solid #555;height:8.15mm;padding:1.2mm 1.5mm;font-size:8.5px;vertical-align:middle}.gp-table th:nth-child(1),.gp-table td:nth-child(1){width:11mm;text-align:center}.gp-table th:nth-child(3),.gp-table td:nth-child(3){width:22mm;text-align:center}.gp-table th:nth-child(4),.gp-table td:nth-child(4){width:22mm;text-align:center}.gp-table th:nth-child(5),.gp-table td:nth-child(5){width:28mm}
.gp-purpose{border:1px solid #555;height:9mm;margin-top:3mm;padding:2.5mm 1.5mm;font-size:8.5px}.gp-purpose-line{border-bottom:1px dotted #777;display:inline-block;width:75%;height:3mm;vertical-align:middle}
.gp-sign-area{border-top:1px solid #777;margin-top:3mm;padding-top:7mm;display:grid;grid-template-columns:repeat(4,1fr);gap:12mm;text-align:center}.gp-sign-line{border-bottom:1px dotted #777;height:6mm;margin:0 3mm 2mm}.gp-sign-label{font-size:8.5px;font-weight:700}
.gp-bottom{border-top:1px solid #c40018;margin-top:5mm;padding-top:1.5mm;display:flex;justify-content:space-between;font-size:7.5px}.gp-bottom strong{color:#b00012}
@media print{@page{size:A4 portrait;margin:10mm}html,body{background:#fff!important}body{margin:0!important}.no-print,.topbar,.sidebar{display:none!important}.main{margin:0!important;width:100%!important;padding:0!important;max-width:none!important}.print-sheet{display:block!important}.gatepass-paper{box-shadow:none!important;width:190mm!important;min-height:277mm!important}}
/* Account / user management */
.auth-tabs{display:flex;gap:6px;background:#edf3f9;padding:5px;border-radius:10px;margin:15px 0}.auth-tab{flex:1;padding:9px;border-radius:7px;background:transparent;font-weight:800;color:#536274}.auth-tab.active{background:#fff;color:#123b68;box-shadow:0 1px 4px #0002}
.account-badge{display:inline-flex;align-items:center;gap:6px;background:#eaf3ff;color:#175cd3;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}
@media print{.print-sheet{display:block!important}}
</style>
</head>
<body>

<div id="loginView" class="login">
  <div class="login-box">
    <div class="login-logo">LPSL</div>
    <h1>Gate Pass Manager</h1>
    <p>Secure local inventory & gate-pass management</p>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="loginTab" onclick="showAuth('login')">Log In</button>
      <button type="button" class="auth-tab" id="registerTab" onclick="showAuth('register')">Create Account</button>
    </div>
    <form id="loginForm">
      <div class="field"><label>Username</label><input id="loginUser" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" type="submit">Sign In</button>
    </form>
    <form id="registerForm" class="hidden">
      <div class="field"><label>Full Name</label><input id="regName" required></div>
      <div class="field"><label>Create Username</label><input id="regUser" minlength="3" required></div>
      <div class="field"><label>Create Password</label><input id="regPass" type="password" minlength="4" required></div>
      <div class="field"><label>Confirm Password</label><input id="regPass2" type="password" minlength="4" required></div>
      <button class="btn primary" type="submit">Create Account</button>
    </form>
    <div class="login-note">Accounts and gate-pass records are stored in this browser's Local Storage. This is a client-side system and should not be treated as server-grade authentication.</div>
  </div>
</div>

<div id="appView" class="app hidden">
  <div class="topbar">
    <div class="brand"><div class="brand-mark">L</div><div>Limburg Power Solutions <small style="display:block;font-size:10px;opacity:.75">Gate Pass & Inventory</small></div></div>
    <div class="top-actions"><span class="user-pill" id="currentUserLabel">Administrator</span><button class="btn small" onclick="logout()">Logout</button></div>
  </div>
  <div class="layout">
    <aside class="sidebar no-print">
      <button class="navbtn active" data-page="dashboard">▦ Dashboard</button>
      <button class="navbtn" data-page="passes">▤ Gate Passes</button>
      <button class="navbtn" data-page="new">＋ New Gate Pass</button>
      <button class="navbtn" data-page="deleted">♻ Deleted / Reserved No.</button>
      <button class="navbtn" data-page="settings">⚙ Settings & Backup</button>
    </aside>
    <main id="main" class="main"></main>
  </div>
</div>

<div id="modal" class="modal hidden no-print"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>

<div id="printSheet" class="print-sheet">
  <div class="gatepass-paper" id="gatepassPaper"></div>
</div>

<script>
/* ==========================================================
   LPSL GATE PASS MANAGER
   Single-file GitHub Pages application
   ========================================================== */

/* IMPORTANT:
   Browser-side credentials can be inspected by anyone who has
   the HTML file. This is a UI lock, not server-grade security.
   Change these values before publishing.
*/
const ADMIN_USER = "LPSLADMIN";
const ADMIN_PASS = "LPSL@2026";

const DBKEY="LPSL_GATEPASS_DB_V1";
const SESSIONKEY="LPSL_GATEPASS_SESSION";
const defaultDB={users:[{username:"LPSLADMIN",name:"Administrator",password:"LPSL@2026",role:"admin"}],passes:[],deleted:[],released:[],counter:1,company:{
  name:"LIMBURG POWER SOLUTIONS LIMITED",
  address:"House #18, Road #18, Sector #10, Uttara, Dhaka-1230",
  phone:"+88 09639115869, +88 01321135711",
  email:"sales@limburg-power.com",
  logoText:"LPSL"
}};

let db=loadDB(), currentPage="dashboard", editingId=null;

function loadDB(){
  try{
    const d=JSON.parse(localStorage.getItem(DBKEY)||"null");
    return Object.assign({},defaultDB,d||{});
  }catch(e){return structuredClone(defaultDB)}
}
function saveDB(){localStorage.setItem(DBKEY,JSON.stringify(db))}
function currentAccount(){try{return JSON.parse(sessionStorage.getItem("LPSL_CURRENT_USER")||"null")}catch(e){return null}}
function isLogged(){return !!currentAccount()}
function showAuth(mode){
 document.getElementById("loginForm").classList.toggle("hidden",mode!=="login");
 document.getElementById("registerForm").classList.toggle("hidden",mode!=="register");
 document.getElementById("loginTab").classList.toggle("active",mode==="login");
 document.getElementById("registerTab").classList.toggle("active",mode==="register");
}
function currentUserName(){return currentAccount()?.name||"Administrator"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(v){return Number(v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function today(){return new Date().toISOString().slice(0,10)}
function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
function toast(msg,type=""){const t=document.getElementById("toast");t.textContent=msg;t.className="toast "+type;setTimeout(()=>t.className="toast hidden",2600)}
function setPage(p){currentPage=p;document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===p));renderPage()}
function logout(){sessionStorage.removeItem(SESSIONKEY);sessionStorage.removeItem("LPSL_CURRENT_USER");location.reload()}

function nextNumber(){
  /* Released numbers may only be reused by an administrator. */
  if(db.released.length){
    const n=db.released.shift();
    saveDB();
    return n;
  }
  let n=db.counter||1;
  const used=new Set(db.passes.map(p=>p.number).concat(db.deleted.map(p=>p.number)));
  while(used.has(formatNo(n))) n++;
  db.counter=n+1; saveDB();
  return formatNo(n);
}
function formatNo(n){return "Lpsl-2026-"+String(n).padStart(3,"0")}
function numberIndex(no){const m=String(no).match(/(\d+)$/);return m?Number(m[1]):0}

function renderPage(){
 if(!isLogged()) return;
 const main=document.getElementById("main");
 if(currentPage==="dashboard") main.innerHTML=dashboardHTML();
 if(currentPage==="passes") main.innerHTML=passesHTML();
 if(currentPage==="new") main.innerHTML=formHTML();
 if(currentPage==="deleted") main.innerHTML=deletedHTML();
 if(currentPage==="settings") main.innerHTML=settingsHTML();
}
function dashboardHTML(){
 const total=db.passes.length, returned=db.passes.reduce((a,p)=>a+p.items.filter(i=>i.returned).length,0);
 const items=db.passes.reduce((a,p)=>a+p.items.length,0), pending=items-returned;
 return `<div class="page-head"><div><h1>Dashboard</h1><div class="sub">Gate pass inventory overview and return status</div></div><div class="actions"><button class="btn primary" onclick="setPage('new')">＋ Create Gate Pass</button></div></div>
 <div class="grid stats">
  <div class="stat"><div class="label">Active Gate Passes</div><div class="value">${total}</div></div>
  <div class="stat"><div class="label">Total Products</div><div class="value">${items}</div></div>
  <div class="stat"><div class="label">Returned Products</div><div class="value kpi-green">${returned}</div></div>
  <div class="stat"><div class="label">Not Returned</div><div class="value kpi-red">${pending}</div></div>
 </div>
 <div class="card"><h2>Recent Gate Passes</h2>${passTable(db.passes.slice().reverse().slice(0,8))}</div>
 <div class="card"><h2>Return Status</h2><div style="display:flex;gap:18px;flex-wrap:wrap;font-size:13px"><span><i class="dot green"></i> Green = Returned</span><span><i class="dot red"></i> Red = Not Returned</span></div></div>`;
}
function passTable(arr){
 if(!arr.length)return `<div class="empty">No gate passes created yet.</div>`;
 return `<div class="table-wrap"><table><thead><tr><th>Gate Pass No.</th><th>Date</th><th>Party / Receiver</th><th>Purpose</th><th>Products</th><th>Return</th><th>Status</th><th>Actions</th></tr></thead><tbody>${arr.map(p=>{
 const total=p.items.length, ret=p.items.filter(i=>i.returned).length;
 const status=ret===total&&total>0?"Complete":ret>0?"Partial":"Pending";
 return `<tr><td><b>${esc(p.number)}</b></td><td>${esc(p.date)}</td><td>${esc(p.receiver)}</td><td>${esc(p.purpose)}</td><td>${total}</td><td><span class="badge ${ret===total&&total>0?'green':'red'}"><i class="dot ${ret===total&&total>0?'green':'red'}"></i>${ret}/${total}</span></td><td><span class="badge ${status==='Complete'?'green':status==='Partial'?'blue':'red'}">${status}</span></td><td><button class="btn small light" onclick="editPass('${p.id}')">Edit</button> <button class="btn small" onclick="printPass('${p.id}')">Print</button> <button class="btn small danger" onclick="deletePass('${p.id}')">Delete</button></td></tr>`}).join("")}</tbody></table></div>`;
}
function passesHTML(){
 return `<div class="page-head"><div><h1>Gate Passes</h1><div class="sub">Create, edit, print and track every gate pass</div></div><button class="btn primary" onclick="setPage('new')">＋ New Gate Pass</button></div>
 <div class="card"><div class="searchbar"><input id="passSearch" placeholder="Search gate pass no., receiver, purpose or product..." oninput="filterPasses()"><button class="btn light" onclick="document.getElementById('passSearch').value='';filterPasses()">Clear</button></div><div id="passTableArea">${passTable(db.passes.slice().reverse())}</div></div>`;
}
function filterPasses(){
 const q=(document.getElementById("passSearch")?.value||"").toLowerCase();
 const arr=db.passes.slice().reverse().filter(p=>JSON.stringify(p).toLowerCase().includes(q));
 document.getElementById("passTableArea").innerHTML=passTable(arr);
}

function formHTML(){
 const p=editingId?db.passes.find(x=>x.id===editingId):null;
 const number=p?p.number:nextNumber();
 if(!p) editingId=null;
 const items=p?p.items:[{name:"",partNo:"",qty:1,returned:false}];
 return `<div class="page-head"><div><h1>${p?"Edit Gate Pass":"Create New Gate Pass"}</h1><div class="sub">${p?"Update the existing gate pass and return status.":"New number is generated automatically and cannot be reused after deletion unless released by admin."}</div></div><div class="actions"><button class="btn light" onclick="setPage('passes')">Cancel</button></div></div>
 <form id="passForm" onsubmit="savePass(event)">
 <div class="card"><h2>Gate Pass Information</h2><div class="form-grid">
  <div class="field"><label>Gate Pass No.</label><input name="number" value="${esc(number)}" readonly></div>
  <div class="field"><label>Date</label><input name="date" type="date" value="${esc(p?.date||today())}" required></div>
  <div class="field"><label>Time</label><input name="time" type="time" value="${esc(p?.time||new Date().toTimeString().slice(0,5))}"></div>
  <div class="field"><label>Type</label><select name="type"><option value="Returnable" ${p?.type!=="Non-Returnable"?"selected":""}>Returnable</option><option value="Non-Returnable" ${p?.type==="Non-Returnable"?"selected":""}>Non-Returnable</option></select></div>
  <div class="field span2"><label>Receiver / Company / Customer</label><input name="receiver" value="${esc(p?.receiver||"")}" required></div>
  <div class="field"><label>Contact / Mobile</label><input name="contact" value="${esc(p?.contact||"")}"></div>
  <div class="field"><label>Carried By</label><input name="carriedBy" value="${esc(p?.carriedBy||"")}"></div>
  <div class="field"><label>Vehicle No.</label><input name="vehicle" value="${esc(p?.vehicle||"")}"></div><div class="field"><label>Received By</label><input name="receivedBy" value="${esc(p?.receivedBy||"")}"></div><div class="field"><label>Store In-Charge</label><input name="storeInCharge" value="${esc(p?.storeInCharge||"")}"></div><div class="field"><label>Authorized By</label><input name="authorizedBy" value="${esc(p?.authorizedBy||"")}"></div><div class="field span2"><label>Purpose / Remarks</label><input name="purpose" value="${esc(p?.purpose||"")}"></div>
  <div class="field span2"><label>Delivery / Return Address</label><input name="address" value="${esc(p?.address||"")}"></div>
 </div></div>

function itemRow(item){
 return `<div class="item-row" style="grid-template-columns:1.35fr 1fr 65px 75px 125px 1fr 42px">
 <input placeholder="Description / Item Details" class="i-name" value="${esc(item.name)}" required>
 <input placeholder="Part No. / Model" class="i-part" value="${esc(item.partNo||"")}">
 <input placeholder="Unit" class="i-unit" value="${esc(item.unit||"PCS")}">
 <input type="number" min="0" step="0.01" placeholder="Qty" class="i-qty" value="${esc(item.qty||1)}">
 <div class="return-cell"><input type="checkbox" class="return-toggle i-return" ${item.returned?"checked":""}> <span class="return-label" style="color:${item.returned?'#137333':'#b42318'}">${item.returned?"RETURNED":"NOT RETURNED"}</span></div>
 <input placeholder="Remarks" class="i-remarks" value="${esc(item.remarks||"")}">
 <button type="button" class="btn small danger remove-item" onclick="this.parentElement.remove()">×</button>
 </div>`;
}
function addItem(){document.getElementById("items").insertAdjacentHTML("beforeend",itemRow({name:"",qty:1,returned:false}));bindReturnLabels()}
function bindReturnLabels(){document.querySelectorAll(".i-return").forEach(x=>{x.onchange=()=>{const s=x.parentElement.querySelector(".return-label");s.textContent=x.checked?"RETURNED":"NOT RETURNED";s.style.color=x.checked?"#137333":"#b42318"}})}
function savePass(e){
 e.preventDefault();
 const f=new FormData(e.target);
 const rows=[...document.querySelectorAll("#items .item-row")];
 if(!rows.length){toast("Add at least one product","error");return}
 const items=rows.map(r=>({name:r.querySelector(".i-name").value.trim(),partNo:r.querySelector(".i-part").value.trim(),qty:Number(r.querySelector(".i-qty").value||0),returned:r.querySelector(".i-return").checked,condition:"N/A",unit:r.querySelector(".i-unit").value.trim(),remarks:r.querySelector(".i-remarks").value.trim()}));
 if(items.some(i=>!i.name)){toast("Every product needs an item name","error");return}
 const data={id:editingId||uid(),createdBy:editingId?(db.passes.find(x=>x.id===editingId)?.createdBy||currentUserName()):currentUserName(),updatedBy:currentUserName(),number:f.get("number"),date:f.get("date"),time:f.get("time"),gate:f.get("gate"),receiver:f.get("receiver"),contact:f.get("contact"),vehicle:f.get("vehicle"),type:f.get("type"),carriedBy:f.get("carriedBy"),receivedBy:f.get("receivedBy"),storeInCharge:f.get("storeInCharge"),authorizedBy:f.get("authorizedBy"),purpose:f.get("purpose"),address:f.get("address"),remarks:f.get("remarks"),preparedBy:f.get("preparedBy"),approvedBy:f.get("approvedBy"),items,updatedAt:new Date().toISOString()};
 if(editingId){const idx=db.passes.findIndex(p=>p.id===editingId);if(idx>=0)db.passes[idx]=data}
 else{data.createdAt=new Date().toISOString();db.passes.push(data)}
 saveDB();toast("Gate pass saved successfully","success");editingId=null;setPage("passes");
}
function editPass(id){editingId=id;setPage("new");setTimeout(bindReturnLabels,0)}
function deletePass(id){
 const p=db.passes.find(x=>x.id===id);if(!p)return;
 if(!confirm(`Delete ${p.number}?\n\nThis number will be permanently blocked and cannot be reused automatically.`))return;
 db.passes=db.passes.filter(x=>x.id!==id);
 if(!db.deleted.some(x=>x.number===p.number))db.deleted.push({number:p.number,deletedAt:new Date().toISOString(),receiver:p.receiver});
 saveDB();toast(`${p.number} deleted and reserved permanently`,"success");renderPage();
}
function deletedHTML(){
 return `<div class="page-head"><div><h1>Deleted / Reserved Numbers</h1><div class="sub">Deleted gate-pass numbers remain blocked. Only the administrator can release one for reuse.</div></div></div>
 <div class="card"><h2>Blocked Gate Pass Numbers</h2>${db.deleted.length?`<div class="table-wrap"><table><thead><tr><th>Gate Pass No.</th><th>Deleted Date</th><th>Original Receiver</th><th>Admin Action</th></tr></thead><tbody>${db.deleted.slice().reverse().map(x=>`<tr><td><b>${esc(x.number)}</b></td><td>${esc(new Date(x.deletedAt).toLocaleString())}</td><td>${esc(x.receiver)}</td><td><button class="btn small danger" onclick="releaseNumber('${esc(x.number)}')">Release For Reuse</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No deleted gate-pass numbers.</div>`}</div>
 <div class="card"><h2>Released Numbers</h2>${db.released.length?db.released.map(n=>`<span class="badge blue" style="margin:3px">${esc(n)}</span>`).join(""):`<div class="empty">No released numbers waiting for reuse.</div>`}
 <div class="footer-note">Releasing a number removes its block and allows the next new gate pass to use it. This action is available only while signed in as administrator.</div></div>`;
}
function releaseNumber(no){
 if(!confirm(`Release ${no} for reuse?\nThis will allow it to be assigned to a future new gate pass.`))return;
 db.deleted=db.deleted.filter(x=>x.number!==no);
 if(!db.released.includes(no))db.released.push(no);
 saveDB();toast(`${no} released for admin reuse`,"success");renderPage();
}

function settingsHTML(){
 return `<div class="page-head"><div><h1>Settings & Backup</h1><div class="sub">Company information and Local Storage backup tools</div></div></div>
 <div class="card settings-box"><h2>Company / Gate Pass Header</h2><div class="form-grid">
 <div class="field span2"><label>Company Name</label><input id="cname" value="${esc(db.company.name)}"></div>
 <div class="field"><label>Phone</label><input id="cphone" value="${esc(db.company.phone)}"></div>
 <div class="field"><label>Email</label><input id="cemail" value="${esc(db.company.email)}"></div>
 <div class="field span4"><label>Address</label><input id="caddress" value="${esc(db.company.address)}"></div>
 </div><br><button class="btn primary" onclick="saveCompany()">Save Company Settings</button></div>
 <div class="card settings-box"><h2>Backup & Restore</h2><p class="sub">Export all gate passes, deleted-number records and settings as a JSON backup. Import restores the selected backup into this browser.</p><div class="actions"><button class="btn dark" onclick="exportBackup()">Download Backup JSON</button><label class="btn light">Import Backup JSON<input type="file" accept=".json,application/json" onchange="importBackup(event)" hidden></label></div></div>
 <div class="card settings-box"><h2>Data Status</h2><p><b>${db.passes.length}</b> active passes &nbsp;|&nbsp; <b>${db.deleted.length}</b> blocked numbers &nbsp;|&nbsp; Next sequence: <b>${formatNo(db.counter)}</b></p></div>
 <div class="card danger-zone settings-box"><h2 style="color:#b42318">Danger Zone</h2><p>Clear all locally stored gate-pass data. This cannot be undone unless you have exported a backup.</p><button class="btn danger" onclick="clearAll()">Delete All Local Data</button></div>`;
}
function saveCompany(){db.company.name=document.getElementById("cname").value;db.company.phone=document.getElementById("cphone").value;db.company.email=document.getElementById("cemail").value;db.company.address=document.getElementById("caddress").value;saveDB();toast("Company settings saved","success")}
function exportBackup(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="LPSL-GatePass-Backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href)
}
function importBackup(e){
 const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.passes||!x.deleted)throw 0;if(!confirm("Replace current Local Storage data with this backup?"))return;db=Object.assign({},defaultDB,x);saveDB();renderPage();toast("Backup restored","success")}catch(_){toast("Invalid backup file","error")}};r.readAsText(file)
}
function clearAll(){if(confirm("Delete ALL gate-pass data from this browser?")){localStorage.removeItem(DBKEY);db=loadDB();renderPage();toast("All local data cleared","success")}}

}

 if(account){sessionStorage.setItem(SESSIONKEY,"1");sessionStorage.setItem("LPSL_CURRENT_USER",JSON.stringify({username:account.username,name:account.name,role:account.role}));document.getElementById("loginView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");document.getElementById("currentUserLabel").textContent=account.name+" ("+account.username+")";renderPage()}
 else toast("Invalid username or password","error");
});
document.getElementById("registerForm").addEventListener("submit",e=>{
 e.preventDefault();
 const name=document.getElementById("regName").value.trim(), u=document.getElementById("regUser").value.trim(), pw=document.getElementById("regPass").value, pw2=document.getElementById("regPass2").value;
 if(pw!==pw2){toast("Passwords do not match","error");return}
 if((db.users||[]).some(x=>x.username.toLowerCase()===u.toLowerCase())){toast("Username already exists","error");return}
 db.users.push({username:u,name,password:pw,role:"user"});saveDB();
 toast("Account created. Please sign in.","success");showAuth("login");document.getElementById("loginUser").value=u;document.getElementById("loginPass").value="";
});


if(isLogged()){document.getElementById("loginView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");const cu=currentAccount();document.getElementById("currentUserLabel").textContent=(cu?.name||"Administrator")+" ("+(cu?.username||"LPSLADMIN")+")";renderPage()}
else{document.getElementById("appView").classList.add("hidden")}
setTimeout(bindReturnLabels,100);
</script>
